name: Deploy whistory to CORESERVER

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-whistory
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify JavaScript syntax
        run: |
          node --check script.js
          node --check data/action-cards.js
          node --check data/history-content.js
          node --check data/people-data.js
          node --check data/modal-data.js
          node --check data/learning-terms.js
          node --check data/timeline-region-data.js

      - name: Run static data verification
        run: node scripts/verify-static.js

      - name: Prepare deployment files
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R assets dist/assets
          cp -R data dist/data
          cp index.html dist/index.html
          cp styles.css dist/styles.css
          cp script.js dist/script.js
          cp image-workbench.html dist/image-workbench.html
          cp image-workbench.css dist/image-workbench.css
          cp image-workbench.js dist/image-workbench.js

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.CORESERVER_SSH_KEY || secrets.OFFICIALSITE_ACTIONS_ED25519 || secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_KEY }}
          CORESERVER_HOST: ${{ secrets.CORESERVER_HOST }}
          CORESERVER_USER: ${{ secrets.CORESERVER_USER }}
          CORESERVER_PORT: ${{ secrets.CORESERVER_PORT }}
          CORESERVER_DEPLOY_PATH: ${{ secrets.CORESERVER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          echo "CORESERVER_HOST=${CORESERVER_HOST:-s59.coreserver.jp}" >> "$GITHUB_ENV"
          echo "CORESERVER_USER=${CORESERVER_USER:-ref}" >> "$GITHUB_ENV"
          echo "CORESERVER_PORT=${CORESERVER_PORT:-22}" >> "$GITHUB_ENV"
          echo "CORESERVER_DEPLOY_PATH=${CORESERVER_DEPLOY_PATH:-/virtual/ref/public_html/www.realemotionfactory.com/whistory/}" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/coreserver_deploy_key
          chmod 600 ~/.ssh/coreserver_deploy_key
          ssh-keyscan -p "${CORESERVER_PORT:-22}" -H "${CORESERVER_HOST:-s59.coreserver.jp}" >> ~/.ssh/known_hosts

      - name: Deploy to whistory folder
        run: |
          set -euo pipefail
          ssh -p "$CORESERVER_PORT" -i ~/.ssh/coreserver_deploy_key "$CORESERVER_USER@$CORESERVER_HOST" "mkdir -p '$CORESERVER_DEPLOY_PATH'"
          rsync -az --delete \
            -e "ssh -p $CORESERVER_PORT -i ~/.ssh/coreserver_deploy_key" \
            dist/ \
            "$CORESERVER_USER@$CORESERVER_HOST:$CORESERVER_DEPLOY_PATH"

      - name: Verify published files
        run: |
          curl -fsSL 'https://www.realemotionfactory.com/whistory/index.html?verify=${{ github.run_id }}' | grep -q '20260727-heading-tooltip-link-removal'
          curl -fsSL 'https://www.realemotionfactory.com/whistory/data/learning-terms.js?verify=${{ github.run_id }}' | grep -q '電子商取引'
